# Docker Compose for production deployment
version: '3.8'

services:
  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: impression3d-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MODEL_CACHE_DIR=/models
      - GPU_DEVICE=cpu
    volumes:
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4

  # Celery worker (CPU)
  celery-worker-cpu:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-celery-worker-cpu-prod
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - MODEL_CACHE_DIR=/models
      - GPU_DEVICE=cpu
    volumes:
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2

  # Celery Flower (monitoring) - Optional in production
  celery-flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-flower-prod
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USERNAME}:${FLOWER_PASSWORD}
    depends_on:
      - redis
      - celery-worker-cpu
    command: celery -A celery_app flower --port=5555

volumes:
  redis_data:
  model_cache:

networks:
  default:
    name: impression3d-network-prod
