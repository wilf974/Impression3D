# Docker Compose for local development
version: '3.8'

services:
  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: impression3d-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: impression3d-postgres
    environment:
      POSTGRES_USER: impression3d
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: impression3d
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impression3d"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://impression3d:dev_password_123@postgres:5432/impression3d
      - MODEL_CACHE_DIR=/models
      - GPU_DEVICE=cpu
    volumes:
      - ../backend:/app
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-celery-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://impression3d:dev_password_123@postgres:5432/impression3d
      - MODEL_CACHE_DIR=/models
      - GPU_DEVICE=cpu
    volumes:
      - ../backend:/app
      - ../ml-models:/ml-models
      - model_cache:/models
      - generated_files:/generated
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info

  # Celery Flower (monitoring)
  celery-flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: impression3d-flower
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker
    command: celery -A celery_app flower --port=5555

  # Frontend (Next.js)
  frontend:
    image: node:18-alpine
    container_name: impression3d-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  redis_data:
  postgres_data:
  model_cache:
  generated_files:

networks:
  default:
    name: impression3d-network
